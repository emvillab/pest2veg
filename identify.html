<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Identify a Pest | Pest2Veg</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <a href="index.html">
            <img
                class="logo"
                src="assets/pest2veg-logo.svg"
                alt="Pest2Veg">
        </a>

        <button
            class="menu-toggle"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false">
            ☰
        </button>

        <nav>
            <a href="index.html">Home</a>
            <a href="gallery.html">Pest Gallery</a>
            <a class="active" href="identify.html">Identify a Pest</a>
            <a href="about.html">About</a>
        </nav>

    </header>

    <main class="section">

        <h1>Identify a Pest</h1>

        <p>
            Use three simple choices to find possible pests.
        </p>

        <div class="controls">

            <div class="form-group">

                <p>
                    1. Which crop is affected?
                </p>

                <div
                    id="crop-options"
                    class="crop-options">
                </div>

                <input
                    type="hidden"
                    id="crop"
                    value="">

            </div>

            <div
                class="form-group"
                id="damage-group"
                hidden>

                <label for="damage">
                    2. What damage can you see?
                </label>

                <select id="damage">
                    <option>Choose a crop first</option>
                </select>

            </div>

            <div
                class="form-group"
                id="location-group"
                hidden>

                <label for="location">
                    3. Where is the damage?
                </label>

                <select id="location">
                    <option>Choose a crop first</option>
                </select>

            </div>

            <button
                class="button"
                id="find-pest"
                type="button" hidden>
                Find Possible Pest
            </button>

        </div>

        <div id="results"></div>

    </main>

    <footer>
        © 2026 Pest2Veg · Supporting sustainable crop awareness and
        UN Sustainable Development Goal 2.
    </footer>

    <script src="data.js"></script>
    <script src="app.js"></script>

</body>

</html>
